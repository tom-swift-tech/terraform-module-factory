# Azure DevOps pipeline for Terraform module CI
#
# Secret variables (Library):
#   TFE_TOKEN / TFE_ORG — optional; VCS-driven publish does not require them
#
# Publishing model: monorepo + HCP/TFE VCS modules with source_directory
# (see docs/TFE_PUBLISHING.md). Merge/tag is the publish signal.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - modules/**
      - policies/**
      - factory/**
      - checkov/**
      - examples/**
      - docs/**
      - .checkov.yaml
      - .tflint.hcl
      - AGENTS.md

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  TF_VERSION: "1.9.8"
  PYTHON_VERSION: "3.11"

stages:
  - stage: Validate
    displayName: Validate policies and modules
    jobs:
      - job: PolicyAndModules
        displayName: Policy + Terraform + tests + Checkov
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              pip install -e "./factory[dev]"
              pip install checkov
            displayName: Install tf-factory, pytest, Checkov

          - script: |
              set -euo pipefail
              tf-factory validate-policy --policies ./policies
              tf-factory generate-naming --policies ./policies
              tf-factory export-policy-data --policies ./policies
              # Fail if generate-naming left a dirty tree vs committed module
              git diff --exit-code -- modules/azure/naming policies/opa/data || {
                echo "##vso[task.logissue type=error]naming module or OPA data out of sync with policies. Run generate-naming + export-policy-data and commit."
                exit 1
              }
            displayName: Validate policy pack and sync artifacts

          - script: |
              set -euo pipefail
              cd factory && pytest -q
            displayName: pytest

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(TF_VERSION)

          - script: |
              set -euo pipefail
              curl -sL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --version
              tflint --init
              tflint --recursive --chdir modules
              tflint --recursive --chdir examples || true
            displayName: tflint

          - script: |
              set -euo pipefail
              echo "== terraform fmt =="
              terraform fmt -check -recursive modules examples

              echo "== terraform validate (modules) =="
              for dir in modules/azure/*/; do
                echo "--- $dir"
                (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
              done

              echo "== terraform test (naming) =="
              (cd modules/azure/naming && terraform init -backend=false -input=false && terraform test)

              echo "== terraform validate (examples) =="
              for dir in examples/*/; do
                echo "--- $dir"
                (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
              done
            displayName: Terraform fmt, validate, test

          - script: |
              checkov -d modules -d examples --config-file .checkov.yaml --framework terraform
            displayName: Run Checkov

  - stage: PublishTFE
    displayName: Confirm TFE catalog (VCS publish)
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Catalog
        displayName: Print registry module addresses
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
          - script: |
              set -euo pipefail
              pip install -e ./factory -q
              echo "VCS-driven modules: configure each catalog source_directory in HCP/TFE."
              echo "See docs/TFE_PUBLISHING.md"
              tf-factory list-modules
            displayName: List catalog registry addresses
